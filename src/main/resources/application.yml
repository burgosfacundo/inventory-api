spring:
  application:
    name: inventory-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

api:
  base-path: /api/v1

geoapify:
  base-url: ${GEOAPIFY_BASE_URL:https://api.geoapify.com}
  api-key: ${GEOAPIFY_API_KEY}
  min-confidence: ${GEOAPIFY_MIN_CONFIDENCE:0.95}

management:
  endpoints:
    web:
      exposure:
        include: health,info