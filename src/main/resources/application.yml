spring:
  application:
    name: inventory-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

api:
  base-path: /api/v1
  documentation:
    title: Inventory API
    version: "@project.version@"
    description: REST API for inventory, warehouse and stock management.

springdoc:
  paths-to-match: "${api.base-path}/**"
  swagger-ui:
    path: /swagger-ui.html

geoapify:
  base-url: ${GEOAPIFY_BASE_URL:https://api.geoapify.com}
  api-key: ${GEOAPIFY_API_KEY}
  min-confidence: ${GEOAPIFY_MIN_CONFIDENCE:0.95}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
    app:
      name: ${api.documentation.title}
      version: ${api.documentation.version}
      description: ${api.documentation.description}